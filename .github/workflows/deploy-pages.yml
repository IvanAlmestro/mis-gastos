name: Deploy a GitHub Pages

# Se ejecuta en cada push a la rama principal y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]   # si tu rama se llama "master", cambiala acá
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # index.html, css/ y js/ están en la raíz

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
